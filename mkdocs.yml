site_name: Labcat
site_description: An intelligent materials research platform and API for screening public materials science data, comparing cited candidates, and customizing ranking priorities.
site_url: https://kewh5868.github.io/labcat/
repo_url: https://github.com/kewh5868/labcat
repo_name: kewh5868/labcat
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: .local/docs-site
strict: true
theme:
  name: material
  logo: assets/labcat-mark.png
  favicon: assets/labcat-mark.png
  font: false
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
# Keep detailed technical records in Git without crowding the published guide.
exclude_docs: |
  /*.md
  !/index.md
  !/first-run.md
  !/installation.md
  !/user-guide.md
  !/examples.md
  !/resources.md
  !/development.md
  /evaluation-results.json
not_in_nav: |
  /installation.md
nav:
  - Start: index.md
  - Install & setup: first-run.md
  - Use Labcat: user-guide.md
  - Examples: examples.md
  - Sources & methods: resources.md
  - Developer notes: development.md
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - stylesheets/labcat.css
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
