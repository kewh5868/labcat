name: Package checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install --require-hashes -r requirements/build.lock
      - name: Install the available application and test extras
        run: >-
          python -c "import pathlib, subprocess, sys, tomllib;
          extras = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project'].get('optional-dependencies', {});
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-e', '.[' + ','.join(extras) + ']'])"
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm test --prefix frontend
      - run: python -m pre_commit run --all-files
      - run: python -m pytest
      - run: python -m build --no-isolation
