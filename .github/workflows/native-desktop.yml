name: Build native desktop applications
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Install Linux system webview build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Install native build CLI
        working-directory: desktop
        run: npm ci
      - name: Check native boundary tests and formatting
        working-directory: desktop
        run: |
          cargo fmt --check
          cargo test --locked
      - name: Build native artifact without publishing
        working-directory: desktop
        run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Preserve macOS application bundle permissions
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          ditto -c -k --sequesterRsrc --keepParent "target/${{ matrix.target }}/release/bundle/macos/Labcat.app" "target/Labcat-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: labcat-native-${{ matrix.target }}
          path: |
            desktop/target/Labcat-*.zip
            desktop/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            desktop/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
