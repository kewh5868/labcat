name: Build native desktop applications
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            native: release/bundle/macos/Labcat.app
            bundles: app
          - os: macos-15-intel
            target: x86_64-apple-darwin
            native: release/bundle/macos/Labcat.app
            bundles: app
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            native: release/labcat-desktop.exe
            bundles: none
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            native: release/labcat-desktop
            bundles: none
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Install Linux system webview build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Install native build CLI
        working-directory: desktop
        run: npm ci
      - name: Check native boundary tests and formatting
        working-directory: desktop
        run: |
          cargo fmt --check
          cargo test --locked
      - name: Build native macOS application
        if: runner.os == 'macOS'
        working-directory: desktop
        run: npm run build -- --target ${{ matrix.target }} --bundles app -- --locked
      - name: Build native Windows or Linux executable
        if: runner.os != 'macOS'
        working-directory: desktop
        run: npm run build -- --target ${{ matrix.target }} --no-bundle -- --locked
      - name: Package only the clean native shell with a checksum
        shell: python
        run: |
          import pathlib
          import shutil
          import subprocess
          import sys

          target = "${{ matrix.target }}"
          source = pathlib.Path("desktop/target") / target / "${{ matrix.native }}"
          if sys.platform == "win32":
              clean = pathlib.Path("desktop/target/Labcat.exe")
              shutil.copyfile(source, clean)
              source = clean
          subprocess.run([
              sys.executable, "scripts/build_desktop_release.py",
              "--target", target, "--app", str(source.resolve()),
              "--output", "desktop/release-assets",
          ], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: labcat-native-${{ matrix.target }}
          path: desktop/release-assets/*
          if-no-files-found: error
          retention-days: 14
