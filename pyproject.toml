[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "labcat"
version = "0.1.0.dev0"
description = "A public-evidence materials triage assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE.rst"]
authors = [{ name = "Keith White" }]
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "gemmi==0.7.5"]
aws = ["boto3>=1.35,<2"]
connections = ["cryptography>=50,<51"]
exports = ["reportlab>=4.4,<5", "python-docx>=1.2,<2"]
dev = ["build>=1.2,<2", "pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.27,<1", "pypdf>=5,<7", "pre-commit>=4.3,<5"]

[project.scripts]
labcat = "labcat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["labcat*"]

[tool.setuptools.package-data]
labcat = ["default.toml", "py.typed", "static/index.html", "static/assets/*", "static/assets/**/*", "static/structure-viewer/**/*", "static/structure-viewer/*", "data/*", "fonts/*.ttf", "fonts/*.txt"]
"labcat.science" = ["data/*.json", "data/*.md", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.docformatter]
recursive = true
wrap-summaries = 72
wrap-descriptions = 72
