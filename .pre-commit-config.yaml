# scikit-package Level 4 hook family, with pinned tool revisions.
# Preserve upstream JSmol sources/licenses and generated build outputs verbatim.
minimum_pre_commit_version: "4.3.0"
# Match the CI Node major and avoid host npm differences in hook installation.
default_language_version:
  node: "24.13.0"
exclude: ^(frontend/public/structure-viewer/vendor/|src/labcat/static/|src/labcat/fonts/|third_party/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-added-large-files
        args: [--enforce-all]
        # Reviewed runtime artwork; keep the size gate on all other app files.
        exclude: ^(desktop/icons/icon\.icns|desktop/ui/labcat-mark\.png|frontend/public/assets/brand/labcat-mark\.png|frontend/public/assets/labcat/(beaker|computer|crystal|nap|typewriter|wires)\.png)$
      - id: detect-private-key
  - repo: https://github.com/PyCQA/docformatter
    rev: v1.7.8
    hooks:
      - id: docformatter
        additional_dependencies: [tomli==2.3.0]
        args: [--in-place, --config, ./pyproject.toml]
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        additional_dependencies: [prettier@3.6.2]
        # Scientific source snapshot bytes are preserved as retrieved.
        exclude: ^src/labcat/science/data/mp_dielectric_snapshot\.json$
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check
        language: system
        types: [python]
